[project]
name = "melodai"
version = "1.0.0"
description = "AI-powered karaoke web app"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
    "httpx>=0.27,<1",
    "requests>=2.31",
    "openai>=1.12",
    "resend>=0.8",
    "werkzeug>=3.0",
]

[project.optional-dependencies]
# Local vocal separation (BS-RoFormer on the CPU). Installed in the Docker image with `--extra separation`;
# without it local separation is unavailable. torch comes from the CPU-only wheel index.
separation = [
    "turbo-roformer",
    "torch>=2.4",
]
# Local lyrics transcription (faster-whisper + wav2vec2 alignment on the CPU). Installed in the Docker image with
# `--extra transcription`; without it local transcription is unavailable.
transcription = [
    "turbo-lyrics",
    "torch>=2.4",
]

[tool.uv.sources]
turbo-roformer = { git = "https://github.com/LoggeL/turbo-roformer", tag = "v0.1.0" }
turbo-lyrics = { git = "https://github.com/LoggeL/turbo-lyrics", tag = "v0.1.0" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
